<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Kantumruy+Pro:wght@300;400;500;600;700&family=Noto+Sans+Khmer:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Sets the colour mode before the first paint (a copy of src/utils/theme.js: keep them in sync).
      ;(function () {
        var mode = 'system'
        try {
          var stored = localStorage.getItem('news-theme')
          if (stored === 'light' || stored === 'dark') mode = stored
        } catch (error) {}
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light')
      })()
    </script>
    <title>News Portal</title>
    <!--
      Default meta tags: what a page that has no link-preview route of its own shows (everything but an article, a category
      and the home page, see deploy/nginx/ponleu-news.conf). Once the page is open the app replaces them with the site settings.
      %VITE_PUBLIC_SITE_URL% is the public address of the site (see .env.example); a share image must be an absolute address.
      Replace public/share-default.png with the real default image (PNG or JPG, 1200x630).
    -->
    <meta name="description" content="The latest and most read news, with categories, search and comments." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="News Portal" />
    <meta property="og:title" content="News Portal" />
    <meta property="og:description" content="The latest and most read news, with categories, search and comments." />
    <meta property="og:image" content="%VITE_PUBLIC_SITE_URL%/share-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
